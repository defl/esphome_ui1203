esphome:
  name: badger-water-meter
  friendly_name: Badger Water Meter

esp32:
  board: esp32dev

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Badger-Meter-Fallback"
    password: !secret ap_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/defl/esphome_ui1203
      ref: main
    components: [badger_meter]
    refresh: 0s

# Badger E-Series Ultrasonic, HR encoder, Itron-ERT colour code — see
# docs/badger-e-series-ultrasonic.md. Check which colour code YOUR cable uses before wiring:
#   BLACK -> GPIO16   clock and power, driven directly at 3.3 V
#   RED   -> GPIO17   data, open collector, external 4.7-10 kOhm pull-up to 3.3 V
#   WHITE -> GND      common
# On a standard-code cable it is RED -> GPIO16, GREEN (or WHITE) -> GPIO17, BLACK -> GND.
badger_meter:
  id: badger_meter_component
  clock_pin: GPIO16
  data_pin:
    number: GPIO17
    mode:
      input: true
      pullup: true
  mode: clocked
  read_interval: 60s   # 15 s or more; faster and the E-Series holds its reading

sensor:
  - platform: badger_meter
    meter_reading:
      name: "Water Meter"
      # Set these from your own meter's LCD. The tested unit reports cubic feet with three
      # implied decimals; others report gallons or cubic metres at a size-dependent resolution.
      unit_of_measurement: "ft³"
      device_class: water
      state_class: total_increasing
      accuracy_decimals: 3
      filters:
        - multiply: 0.001
        # Drop reversals and implausible jumps: TOTAL_INCREASING reads a reversal as a meter
        # reset, and a mis-framed digit would put a spike in Home Assistant's statistics.
        - lambda: |-
            static float last = NAN;
            if (!std::isnan(last) && (x < last || x - last > 100.0f)) return {};
            last = x;
            return x;
    raw_value:
      name: "Water Meter Raw Value"
    flow_rate:
      name: "Water Meter Flow Rate"   # E-Series GC field, whole gal/min

text_sensor:
  - platform: badger_meter
    raw_string:
      name: "Water Meter Raw String"
    meter_id:
      name: "Water Meter ID"

button:
  - platform: template
    name: "Read Water Meter"
    on_press:
      - lambda: id(badger_meter_component).request_read();
